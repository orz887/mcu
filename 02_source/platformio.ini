[platformio]
default_envs = flappy_f103

[env]
platform = ststm32@20.0.0
board = genericSTM32F103C8
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<*> -<oled_check.c> -<oled_gpio_spi.c>
build_flags =
    -std=gnu11
    -DHSE_VALUE=8000000U
    -DFIRMWARE_VERSION=\"1.0.0\"

[env:flappy_f103]
build_flags =
    ${env.build_flags}
    -DBOARD_OLED_GPIO=1
build_src_filter = +<*> -<oled_check.c>

; 保留已通过实屏诊断的192等待，功能与正常版一致，画面刷新会较慢。
[env:flappy_f103_compat]
build_flags =
    ${env.build_flags}
    -DBOARD_OLED_GPIO=1
    -DAPP_OLED_GPIO_DELAY_LOOPS=192U
build_src_filter = +<*> -<oled_check.c>

[env:board_selftest]
build_flags =
    ${env.build_flags}
    -DBOARD_SELFTEST=1
    -DBOARD_FORCE_HSI=1
    -DBOARD_OLED_GPIO=1
    -DAPP_OLED_GPIO_DELAY_LOOPS=192U
build_src_filter = +<*> -<oled_check.c>

; 单独的亮屏诊断入口；不编译游戏主循环，避免与 main.c 重复。
[env:oled_check]
build_flags = ${env.build_flags}
build_src_filter = -<*> +<board.c> +<display.c> +<oled_check.c>

; 保持相同画面和初始化，只将屏幕传输切换成低速GPIO模拟SPI。
[env:oled_check_gpio]
build_flags =
    ${env.build_flags}
    -DBOARD_OLED_GPIO=1
    -DAPP_OLED_GPIO_DELAY_LOOPS=192U
build_src_filter = -<*> +<board.c> +<display.c> +<oled_check.c> +<oled_gpio_spi.c>
